name: Somnia HTML documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-html:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build strict HTML documentation
        id: build
        continue-on-error: true
        run: mkdocs build --strict > mkdocs-build.txt 2>&1
      - name: Show strict-build diagnostic
        if: always()
        run: cat mkdocs-build.txt
      - name: Upload strict-build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somnia-html-documentation-log
          path: mkdocs-build.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated HTML site
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: somnia-html-documentation
          path: site/
          if-no-files-found: error
          retention-days: 14
      - name: Fail if strict HTML build failed
        if: steps.build.outcome != 'success'
        run: exit 1
