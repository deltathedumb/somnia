name: Somnia foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpython:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q somnia tests tools examples
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v > cpython-tests.txt 2>&1
      - name: Show unit-test diagnostic
        if: always()
        run: cat cpython-tests.txt
      - name: Upload unit-test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpython-foundation-tests
          path: cpython-tests.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run foundation example
        if: always()
        run: python -m examples.foundation
      - name: Run deterministic reference snapshot
        if: always()
        run: python -m tests.parity.model_snapshot
      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome != 'success'
        run: exit 1

  asmpython-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Check out asmpython beta/3.14.0
        run: git clone --depth 1 --branch beta/3.14.0 https://github.com/deltathedumb/asmpython.git ../asmpython
      - name: Audit whole-program import graph
        id: import_audit
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/../asmpython:${{ github.workspace }}
        run: |
          python -m asmpython._compiler.import_audit \
            tests/parity/model_snapshot.py \
            > asmpython-import-audit.txt 2>&1
      - name: Show import-graph diagnostic
        if: always()
        run: cat asmpython-import-audit.txt
      - name: Run CPython/asmpython differential probe
        id: parity
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/../asmpython:${{ github.workspace }}
        run: |
          python tools/dualrun.py tests/parity/model_snapshot.py \
            > asmpython-parity.txt 2>&1
      - name: Show differential diagnostic
        if: always()
        run: cat asmpython-parity.txt
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asmpython-foundation-diagnostics
          path: |
            asmpython-import-audit.txt
            asmpython-parity.txt
          if-no-files-found: error
          retention-days: 7
      - name: Record current compatibility status
        if: always()
        run: |
          if [ "${{ steps.import_audit.outcome }}" = "success" ] && [ "${{ steps.parity.outcome }}" = "success" ]; then
            echo "asmpython parity passed"
          else
            echo "asmpython currently has a documented compiler/runtime gap"
          fi
